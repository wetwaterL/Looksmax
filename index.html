<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Livsstilslaben</title>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Livsstilslaben">
<meta name="theme-color" content="#2f5d4f">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">

<style>
  :root{
    --bg:#f6f4ee;
    --paper:#ffffff;
    --ink:#1c1f1c;
    --ink-soft:#5a5f58;
    --line:#dedad0;
    --moss:#2f5d4f;
    --moss-soft:#e4ede9;
    --clay:#b5623c;
    --clay-soft:#f3e3da;
    --gold:#c99a3e;
    --gold-soft:#f6ecd6;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.55;
  }
  .wrap{max-width:900px;margin:0 auto;padding:40px 24px 80px;}
  header.top{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:28px;
    gap:16px;flex-wrap:wrap;
  }
  header.top h1{
    font-size:30px;font-weight:600;margin:0;letter-spacing:.2px;
  }
  header.top p{margin:4px 0 0;color:var(--ink-soft);font-size:15px;font-family:Arial,sans-serif;}
  button{
    font-family:Arial,sans-serif;font-size:14px;cursor:pointer;
    border-radius:var(--radius);border:1px solid var(--ink);
    background:var(--ink);color:#fff;padding:10px 18px;
  }
  button.secondary{background:transparent;color:var(--ink);}
  button.ghost{background:transparent;border-color:var(--line);color:var(--ink-soft);}
  button:active{transform:scale(0.98);}
  input,textarea,select{
    font-family:Arial,sans-serif;font-size:14px;
    border:1px solid var(--line);border-radius:8px;padding:9px 11px;
    background:#fff;color:var(--ink);width:100%;
  }
  textarea{resize:vertical;}
  label{font-family:Arial,sans-serif;font-size:12px;color:var(--ink-soft);display:block;margin-bottom:5px;letter-spacing:.3px;}
  .field{margin-bottom:14px;}

  .toolbar{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;align-items:center;}
  .toolbar input[type=text]{flex:1;min-width:160px;}
  .chip{
    font-family:Arial,sans-serif;font-size:12.5px;padding:6px 12px;border-radius:999px;
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer;white-space:nowrap;
  }
  .chip.active{background:var(--moss);border-color:var(--moss);color:#fff;}

  .card{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;margin-bottom:14px;cursor:pointer;transition:border-color .15s;
  }
  .card:hover{border-color:var(--moss);}
  .card .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .card h3{margin:0 0 6px;font-size:19px;font-weight:600;}
  .card p.desc{margin:0;color:var(--ink-soft);font-size:15px;}
  .badge{
    font-family:Arial,sans-serif;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;
    white-space:nowrap;letter-spacing:.2px;
  }
  .badge.moss{background:var(--moss-soft);color:var(--moss);}
  .meta{font-family:Arial,sans-serif;font-size:12.5px;color:var(--ink-soft);margin-top:10px;display:flex;gap:14px;}

  .empty{
    text-align:center;padding:60px 20px;color:var(--ink-soft);font-family:Arial,sans-serif;
  }

  .backline{display:flex;align-items:center;gap:10px;margin-bottom:20px;font-family:Arial,sans-serif;}
  .backline button{padding:7px 14px;font-size:13px;}

  .detail h2{font-size:26px;margin:0 0 6px;}
  .detail .desc{font-size:16px;color:var(--ink-soft);margin:0 0 18px;}

  .entry{
    border-left:3px solid var(--line);padding:10px 0 10px 16px;margin-bottom:12px;
  }
  .entry.støtter{border-left-color:var(--moss);}
  .entry.motsier{border-left-color:var(--clay);}
  .entry.spørsmål{border-left-color:var(--gold);}
  .entry-tag{
    font-family:Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.4px;
    text-transform:uppercase;
  }
  .entry.støtter .entry-tag{color:var(--moss);}
  .entry.motsier .entry-tag{color:var(--clay);}
  .entry.spørsmål .entry-tag{color:var(--gold);}
  .entry p{margin:5px 0;}
  .entry a{color:var(--moss);text-decoration:none;font-family:Arial,sans-serif;font-size:13px;}
  .entry .entry-meta{font-family:Arial,sans-serif;font-size:12px;color:var(--ink-soft);}

  .form-box{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;margin-top:22px;
  }
  .form-box h4{margin:0 0 14px;font-family:Arial,sans-serif;font-size:14px;color:var(--ink-soft);letter-spacing:.3px;}
  .stance-row{display:flex;gap:8px;margin-bottom:14px;}
  .stance-btn{
    flex:1;font-family:Arial,sans-serif;font-size:13px;padding:9px;border-radius:8px;
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer;
  }
  .stance-btn.active[data-s="støtter"]{background:var(--moss-soft);border-color:var(--moss);color:var(--moss);}
  .stance-btn.active[data-s="motsier"]{background:var(--clay-soft);border-color:var(--clay);color:var(--clay);}
  .stance-btn.active[data-s="spørsmål"]{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:10;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--paper);border-radius:var(--radius);padding:24px;max-width:460px;width:100%;
    max-height:85vh;overflow:auto;
  }
  .modal h3{margin:0 0 14px;font-size:19px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
  .error{color:var(--clay);font-family:Arial,sans-serif;font-size:12.5px;margin-top:-8px;margin-bottom:10px;}
  .hint{font-family:Arial,sans-serif;font-size:12px;color:var(--ink-soft);margin-top:-8px;margin-bottom:16px;}
  .status{font-family:Arial,sans-serif;font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:14px;}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>Livsstilslaben</h1>
      <p>Idéer og systemer for et bedre liv — samlet, testet, diskutert.</p>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="ghost" id="settingsBtn" title="Innstillinger" style="padding:10px 14px;">&#9881;</button>
      <button id="newTopicBtn">+ Ny idé</button>
    </div>
  </header>

  <div id="statusLine" class="status" style="display:none;"></div>

  <div id="listView">
    <div class="toolbar">
      <input type="text" id="search" placeholder="Søk etter tema...">
    </div>
    <div class="toolbar" id="categoryChips"></div>
    <div id="topicList"></div>
  </div>

  <div id="detailView" style="display:none;">
    <div class="backline">
      <button class="ghost" id="backBtn">&larr; Tilbake</button>
    </div>
    <div class="detail">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <span class="badge moss" id="detailCategory"></span>
        <button id="deleteTopicBtn" style="display:none;background:transparent;border:1px solid var(--clay);color:var(--clay);padding:6px 12px;font-size:12.5px;border-radius:8px;">Slett tema</button>
      </div>
      <h2 id="detailTitle"></h2>
      <p class="desc" id="detailDesc"></p>
      <div id="entryList"></div>

      <div class="form-box">
        <h4>Legg til argument, bevis eller kilde</h4>
        <div class="stance-row" id="stanceRow">
          <button class="stance-btn" data-s="støtter" type="button">Støtter</button>
          <button class="stance-btn" data-s="motsier" type="button">Motsier</button>
          <button class="stance-btn" data-s="spørsmål" type="button">Spørsmål</button>
        </div>
        <div class="field">
          <label>Hva vil du si?</label>
          <textarea id="entryText" rows="3" placeholder="F.eks: Studie fra 2023 viser at..."></textarea>
        </div>
        <div class="field">
          <label>Lenke til kilde (valgfritt)</label>
          <input type="text" id="entryLink" placeholder="https://...">
        </div>
        <div id="entryError" class="error" style="display:none;"></div>
        <button id="addEntryBtn">Legg til</button>
      </div>
    </div>
  </div>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>Ny idé eller system</h3>
    <div class="field">
      <label>Tittel / påstand</label>
      <input type="text" id="newTitle" placeholder="F.eks: 10 000 skritt om dagen gir bedre humør">
    </div>
    <div class="field">
      <label>Kategori</label>
      <input type="text" id="newCategory" placeholder="F.eks: Trening, Søvn, Kosthold, Vaner...">
    </div>
    <div class="field">
      <label>Beskrivelse</label>
      <textarea id="newDesc" rows="4" placeholder="Beskriv ideen eller systemet kort"></textarea>
    </div>
    <div id="newError" class="error" style="display:none;"></div>
    <div class="modal-actions">
      <button class="secondary" id="cancelNew">Avbryt</button>
      <button id="saveNew">Lagre</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="settingsOverlay">
  <div class="modal">
    <h3 id="settingsTitle">Innstillinger</h3>
    <div id="settingsLoggedOut">
      <div class="field">
        <label>Admin-kode</label>
        <input type="password" id="adminCodeInput" placeholder="Skriv inn kode">
      </div>
      <div id="adminError" class="error" style="display:none;">Feil kode.</div>
      <div class="modal-actions">
        <button class="secondary" id="closeSettings">Lukk</button>
        <button id="submitAdminCode">Logg inn</button>
      </div>
    </div>
    <div id="settingsLoggedIn" style="display:none;">
      <p class="hint" style="margin-bottom:16px;">Du er logget inn som admin. Du kan nå slette temaer og innlegg.</p>
      <div class="modal-actions">
        <button class="secondary" id="closeSettings2">Lukk</button>
        <button id="logoutAdmin">Logg ut</button>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCS5CQldAKJ4Smp3pEX4I7f5jTZdukAVJc",
  authDomain: "looksmax-318ed.firebaseapp.com",
  projectId: "looksmax-318ed",
  storageBucket: "looksmax-318ed.firebasestorage.app",
  messagingSenderId: "43577739406",
  appId: "1:43577739406:web:c1dd0675f7893e028361df"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection('livsstilslaben').doc('data');

// Endre koden her til det du vil ha som admin-passord:
const ADMIN_CODE = "livsstil2026";

let data = { topics: [] };
let currentTopicId = null;
let activeCategory = null;
let selectedStance = null;
let isAdmin = localStorage.getItem('ll_admin') === 'true';

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function setStatus(msg, isError){
  const el = document.getElementById('statusLine');
  if(!msg){ el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.style.color = isError ? 'var(--clay)' : 'var(--ink-soft)';
  el.textContent = msg;
}

// Live sync: listen for changes from Firestore, from this device or any other.
docRef.onSnapshot(
  (snap) => {
    if(snap.exists){
      data = snap.data() || { topics: [] };
    } else {
      data = { topics: [] };
    }
    setStatus('');
    render();
    if(currentTopicId){
      const t = data.topics.find(x => x.id === currentTopicId);
      if(t) renderEntries(t);
    }
  },
  (err) => {
    console.error(err);
    setStatus('Kunne ikke koble til databasen. Sjekk internett-tilkoblingen.', true);
  }
);

async function saveData(){
  try{
    await docRef.set(data);
  }catch(e){
    console.error('Kunne ikke lagre', e);
    setStatus('Kunne ikke lagre endringen. Prøv igjen.', true);
  }
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  renderChips();
  renderList();
}

function renderChips(){
  const cats = [...new Set(data.topics.map(t => t.category).filter(Boolean))];
  const wrap = document.getElementById('categoryChips');
  wrap.innerHTML = '';
  if(cats.length === 0){ return; }
  const allChip = document.createElement('div');
  allChip.className = 'chip' + (activeCategory === null ? ' active' : '');
  allChip.textContent = 'Alle';
  allChip.onclick = () => { activeCategory = null; render(); };
  wrap.appendChild(allChip);
  cats.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (activeCategory === c ? ' active' : '');
    chip.textContent = c;
    chip.onclick = () => { activeCategory = c; render(); };
    wrap.appendChild(chip);
  });
}

function renderList(){
  const search = (document.getElementById('search').value || '').toLowerCase();
  const listEl = document.getElementById('topicList');
  let topics = data.topics.filter(t => {
    if(activeCategory && t.category !== activeCategory) return false;
    if(search && !((t.title||'').toLowerCase().includes(search) || (t.description||'').toLowerCase().includes(search))) return false;
    return true;
  });
  topics = topics.slice().sort((a,b) => (b.createdAt||0) - (a.createdAt||0));

  if(topics.length === 0){
    listEl.innerHTML = '<div class="empty">Ingen idéer ennå. Trykk "+ Ny idé" for å legge til den første.</div>';
    return;
  }

  listEl.innerHTML = '';
  topics.forEach(t => {
    const card = document.createElement('div');
    card.className = 'card';
    const n = (t.entries||[]).length;
    card.innerHTML = `
      <div class="row">
        <h3>${escapeHtml(t.title)}</h3>
        <div style="display:flex;gap:8px;align-items:center;">
          ${t.category ? `<span class="badge moss">${escapeHtml(t.category)}</span>` : ''}
          ${isAdmin ? `<button class="del-topic-btn" data-id="${t.id}" style="background:transparent;border:1px solid var(--clay);color:var(--clay);padding:4px 9px;font-size:12px;border-radius:8px;">Slett</button>` : ''}
        </div>
      </div>
      <p class="desc">${escapeHtml(t.description||'')}</p>
      <div class="meta"><span>${n} ${n===1?'innspill':'innspill'}</span></div>
    `;
    card.onclick = (e) => {
      if(e.target.classList.contains('del-topic-btn')) return;
      openDetail(t.id);
    };
    const delBtn = card.querySelector('.del-topic-btn');
    if(delBtn){
      delBtn.onclick = async (e) => {
        e.stopPropagation();
        if(!confirm(`Slette "${t.title}" og alle innspill under den?`)) return;
        data.topics = data.topics.filter(x => x.id !== t.id);
        await saveData();
      };
    }
    listEl.appendChild(card);
  });
}

function openDetail(id){
  currentTopicId = id;
  const t = data.topics.find(x => x.id === id);
  if(!t) return;
  document.getElementById('listView').style.display = 'none';
  document.getElementById('detailView').style.display = 'block';
  document.getElementById('detailCategory').textContent = t.category || 'Uten kategori';
  document.getElementById('detailTitle').textContent = t.title;
  document.getElementById('detailDesc').textContent = t.description || '';
  selectedStance = null;
  document.querySelectorAll('.stance-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('entryText').value = '';
  document.getElementById('entryLink').value = '';
  document.getElementById('entryError').style.display = 'none';
  const delTopicBtn = document.getElementById('deleteTopicBtn');
  delTopicBtn.style.display = isAdmin ? 'inline-block' : 'none';
  delTopicBtn.onclick = async () => {
    if(!confirm(`Slette "${t.title}" og alle innspill under den?`)) return;
    data.topics = data.topics.filter(x => x.id !== t.id);
    await saveData();
    document.getElementById('backBtn').click();
  };
  renderEntries(t);
}

function renderEntries(t){
  const el = document.getElementById('entryList');
  const entries = (t.entries||[]).slice().sort((a,b) => (b.createdAt||0)-(a.createdAt||0));
  if(entries.length === 0){
    el.innerHTML = '<p class="hint" style="margin-bottom:18px;">Ingen argumenter eller kilder lagt til ennå.</p>';
    return;
  }
  el.innerHTML = entries.map(e => `
    <div class="entry ${e.stance}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
        <span class="entry-tag">${e.stance}</span>
        ${isAdmin ? `<button class="del-entry-btn" data-id="${e.id}" style="background:transparent;border:none;color:var(--clay);font-family:Arial,sans-serif;font-size:12px;cursor:pointer;">Slett</button>` : ''}
      </div>
      <p>${escapeHtml(e.text)}</p>
      ${e.link ? `<a href="${escapeHtml(e.link)}" target="_blank" rel="noopener">${escapeHtml(e.link)}</a><br>` : ''}
      <span class="entry-meta">${new Date(e.createdAt).toLocaleDateString('no-NO')}</span>
    </div>
  `).join('');
  el.querySelectorAll('.del-entry-btn').forEach(btn => {
    btn.onclick = async () => {
      if(!confirm('Slette dette innspillet?')) return;
      t.entries = (t.entries||[]).filter(x => x.id !== btn.getAttribute('data-id'));
      await saveData();
    };
  });
}

document.getElementById('backBtn').onclick = () => {
  currentTopicId = null;
  document.getElementById('detailView').style.display = 'none';
  document.getElementById('listView').style.display = 'block';
  render();
};

document.getElementById('search').addEventListener('input', renderList);

document.querySelectorAll('.stance-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.stance-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedStance = btn.getAttribute('data-s');
  });
});

document.getElementById('addEntryBtn').onclick = async () => {
  const errEl = document.getElementById('entryError');
  const text = document.getElementById('entryText').value.trim();
  const link = document.getElementById('entryLink').value.trim();
  if(!selectedStance){
    errEl.textContent = 'Velg om innspillet støtter, motsier eller stiller et spørsmål.';
    errEl.style.display = 'block';
    return;
  }
  if(!text){
    errEl.textContent = 'Skriv inn en tekst først.';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';
  const t = data.topics.find(x => x.id === currentTopicId);
  if(!t) return;
  t.entries = t.entries || [];
  t.entries.push({ id: uid(), stance: selectedStance, text, link, createdAt: Date.now() });
  await saveData();
  document.getElementById('entryText').value = '';
  document.getElementById('entryLink').value = '';
};

document.getElementById('newTopicBtn').onclick = () => {
  document.getElementById('newTitle').value = '';
  document.getElementById('newCategory').value = '';
  document.getElementById('newDesc').value = '';
  document.getElementById('newError').style.display = 'none';
  document.getElementById('modalOverlay').classList.add('open');
};

document.getElementById('cancelNew').onclick = () => {
  document.getElementById('modalOverlay').classList.remove('open');
};

document.getElementById('saveNew').onclick = async () => {
  const title = document.getElementById('newTitle').value.trim();
  const category = document.getElementById('newCategory').value.trim();
  const description = document.getElementById('newDesc').value.trim();
  const errEl = document.getElementById('newError');
  if(!title){
    errEl.textContent = 'Tittelen kan ikke være tom.';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';
  data.topics.push({ id: uid(), title, category, description, entries: [], createdAt: Date.now() });
  await saveData();
  document.getElementById('modalOverlay').classList.remove('open');
};

function refreshSettingsView(){
  document.getElementById('settingsLoggedOut').style.display = isAdmin ? 'none' : 'block';
  document.getElementById('settingsLoggedIn').style.display = isAdmin ? 'block' : 'none';
  document.getElementById('adminCodeInput').value = '';
  document.getElementById('adminError').style.display = 'none';
}

document.getElementById('settingsBtn').onclick = () => {
  refreshSettingsView();
  document.getElementById('settingsOverlay').classList.add('open');
};
document.getElementById('closeSettings').onclick = () => document.getElementById('settingsOverlay').classList.remove('open');
document.getElementById('closeSettings2').onclick = () => document.getElementById('settingsOverlay').classList.remove('open');

document.getElementById('submitAdminCode').onclick = () => {
  const code = document.getElementById('adminCodeInput').value;
  if(code === ADMIN_CODE){
    isAdmin = true;
    localStorage.setItem('ll_admin', 'true');
    refreshSettingsView();
    render();
    if(currentTopicId){
      const t = data.topics.find(x => x.id === currentTopicId);
      if(t){ renderEntries(t); document.getElementById('deleteTopicBtn').style.display = 'inline-block'; }
    }
  } else {
    document.getElementById('adminError').style.display = 'block';
  }
};

document.getElementById('logoutAdmin').onclick = () => {
  isAdmin = false;
  localStorage.removeItem('ll_admin');
  document.getElementById('settingsOverlay').classList.remove('open');
  render();
  if(currentTopicId){
    const t = data.topics.find(x => x.id === currentTopicId);
    if(t){ renderEntries(t); document.getElementById('deleteTopicBtn').style.display = 'none'; }
  }
};

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
